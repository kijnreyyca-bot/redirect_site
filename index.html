<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141c">
  <title>Pinterest Redirect Hub</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #10141c; color: #f2f5fa; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #25314b, transparent 60%), #10141c; }
    main { width: min(520px, 100%); padding: clamp(24px, 6vw, 40px); border: 1px solid #ffffff20; border-radius: 22px; background: #141a24e8; box-shadow: 0 24px 80px #0008; }
    .eyebrow { color: #e60023; font-size: 11px; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(30px, 7vw, 42px); line-height: 1.1; letter-spacing: -.04em; }
    p { margin: 0 0 20px; color: #aab4c4; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; }
    input { width: 100%; min-height: 48px; border-radius: 12px; font: inherit; padding: 0 14px; border: 1px solid #ffffff2a; background: #0d1119; color: inherit; margin-bottom: 16px; }
    .links-list { max-height: 220px; overflow-y: auto; border: 1px solid #ffffff1a; border-radius: 12px; background: #0d1119; padding: 8px; margin-bottom: 12px; }
    .link-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: inherit; transition: background 0.15s ease; }
    .link-item:hover, .link-item:focus { background: #ffffff12; outline: none; }
    .link-item .badge { font-size: 11px; background: #ffffff15; padding: 2px 8px; border-radius: 6px; color: #ff8080; }
    .shortcut-hint { font-size: 12px; color: #8a99ad; margin-top: -10px; margin-bottom: 16px; }
    #status { min-height: 1.5em; margin: 8px 0 0; color: #ffb8b8; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Pinterest Hub</div>
    <h1>Regional Redirects</h1>
    <p>Type a shortcut to jump directly to a localized Pinterest site, or filter the list.</p>

    <!-- Quick Redirect Input -->
    <label for="shortcut">Quick redirect / Alias</label>
    <input type="text" id="shortcut" placeholder="Type shortcut (e.g., 'ru', 'fr') & press Enter..." autocomplete="off">
    <div class="shortcut-hint">Shortcuts: <strong>ru</strong>, <strong>fr</strong>, <strong>de</strong>, <strong>global</strong>, <strong>uk</strong></div>

    <label for="search">Filter destinations</label>
    <input type="text" id="search" placeholder="Filter list..." autocomplete="off">

    <div class="links-list" id="links-container" role="region" aria-label="Destinations list"></div>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const destinations = [
      { label: "Russian Pinterest", url: "https://ru.pinterest.com/", category: "ru.pinterest.com", shortcut: "ru" },
      { label: "French Pinterest", url: "https://fr.pinterest.com/", category: "fr.pinterest.com", shortcut: "fr" },
      { label: "German Pinterest", url: "https://de.pinterest.com/", category: "de.pinterest.com", shortcut: "de" },
      { label: "Global Pinterest", url: "https://pinterest.com/", category: "pinterest.com", shortcut: "global" },
      { label: "British Pinterest", url: "https://uk.pinterest.com/", category: "uk.pinterest.com", shortcut: "uk" }
    ];

    const shortcutInput = document.querySelector("#shortcut");
    const searchInput = document.querySelector("#search");
    const container = document.querySelector("#links-container");
    const status = document.querySelector("#status");

    // Handle instant redirect on Enter
    shortcutInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const query = shortcutInput.value.trim().toLowerCase();
        const match = destinations.find(item => item.shortcut === query || item.category === query);

        if (match) {
          status.textContent = "";
          window.location.href = match.url; // Performs the redirect
        } else {
          status.textContent = `No redirect found for "${query}". Try 'ru', 'fr', 'de', 'global', or 'uk'.`;
        }
      }
    });

    // Render list
    function renderLinks(filterText = "") {
      container.innerHTML = "";
      const query = filterText.toLowerCase().trim();
      
      const filtered = destinations.filter(item => 
        item.label.toLowerCase().includes(query) || 
        item.category.toLowerCase().includes(query) ||
        item.shortcut.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding: 16px; text-align: center; color: #aab4c4;">No matching sites found.</div>`;
        return;
      }

      for (const dest of filtered) {
        const a = document.createElement("a");
        a.href = dest.url;
        a.className = "link-item";
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        
        a.innerHTML = `
          <span>${dest.label} <small style="color:#8a99ad;">(:${dest.shortcut})</small></span>
          <span class="badge">${dest.category}</span>
        `;
        container.append(a);
      }
    }

    renderLinks();

    searchInput.addEventListener("input", (e) => {
      renderLinks(e.target.value);
    });
  </script>
</body>
</html>
