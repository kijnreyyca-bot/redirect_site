<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" id="theme-color" content="#1a1a1d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231a1a1d%27/%3E%3Cpath d=%27M12 9l11 7-11 7z%27 fill=%27%23c2f28b%27/%3E%3C/svg%3E">
  <title>Pinterest European Hub</title>
  <script>
    try {
      var savedTheme = localStorage.getItem('theme');
      if (/^(void|dark|white|blue)$/.test(savedTheme)) document.documentElement.dataset.theme = savedTheme;
    } catch (error) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="themes.css">
  <style>
    body { display: grid; place-items: center; padding: 24px; background: var(--glow, var(--bg)), var(--bg); }
    main {
      position: relative;
      z-index: 1;
      width: min(520px, 100%);
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    [data-theme="void"] main { backdrop-filter: none; -webkit-backdrop-filter: none; }
    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 8px 0;
      font: 600 clamp(30px, 7vw, 42px)/1.1 var(--display);
      letter-spacing: -.04em;
      color: var(--ink);
    }
    p { margin: 0 0 20px; color: var(--muted); }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
    input {
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      font: inherit;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: rgba(var(--fx), .04);
      color: var(--ink);
      margin-bottom: 16px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--ac), .14); }
    input::placeholder { color: var(--faint); }
    .links-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(var(--fx), .03);
      padding: 8px;
      margin-bottom: 12px;
      scrollbar-width: thin;
    }
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--ink);
      transition: background .15s ease;
    }
    .link-item:hover, .link-item:focus { background: rgba(var(--fx), .07); outline: none; }
    .link-item small { color: var(--faint); }
    .badge {
      font-size: 11px;
      background: rgba(var(--fx), .07);
      padding: 2px 8px;
      border-radius: 6px;
      color: var(--muted);
      white-space: nowrap;
    }
    .empty-note { padding: 16px; text-align: center; color: var(--muted); }
    .shortcut-hint { font-size: 12px; color: var(--faint); margin-top: -10px; margin-bottom: 16px; }
    #status { min-height: 1.5em; margin: 8px 0 0; color: var(--danger); font-size: 13px; }
  </style>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>

  <div class="theme-picker floating">
    <button class="theme-btn" id="theme-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="theme-menu">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
      <span class="theme-label">Theme</span>
    </button>
    <div class="theme-menu" id="theme-menu" role="menu" aria-label="Choose a theme" hidden>
      <button class="theme-opt" role="menuitemradio" data-t="void" aria-checked="false"><span class="swatch sw-void"></span>The Void<span class="check">?</span></button>
      <button class="theme-opt" role="menuitemradio" data-t="dark" aria-checked="true"><span class="swatch sw-dark"></span>Dark<span class="check">?</span></button>
      <button class="theme-opt" role="menuitemradio" data-t="white" aria-checked="false"><span class="swatch sw-white"></span>White<span class="check">?</span></button>
      <button class="theme-opt" role="menuitemradio" data-t="blue" aria-checked="false"><span class="swatch sw-blue"></span>Dark Blue<span class="check">?</span></button>
    </div>
  </div>

  <main>
    <div class="eyebrow">Pinterest Hub</div>
    <h1>European Redirects</h1>
    <p>Type a shortcut code (e.g., 'de', 'fr', 'pl') and press Enter to jump instantly.</p>

    <label for="shortcut">Quick redirect / Alias</label>
    <input type="text" id="shortcut" placeholder="Type shortcut (e.g., 'de', 'fr', 'ru') &amp; press Enter..." autocomplete="off">
    <div class="shortcut-hint">Shortcuts: <strong>de</strong>, <strong>fr</strong>, <strong>ch</strong>, <strong>pl</strong>, <strong>ru</strong>, <strong>ua</strong>, <strong>uk</strong>, etc.</div>

    <label for="search">Filter destinations</label>
    <input type="text" id="search" placeholder="Filter list..." autocomplete="off">

    <div class="links-list" id="links-container" role="region" aria-label="Destinations list"></div>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
const destinations = [
      { label: "Global Pinterest", url: "https://pinterest.com/", category: "pinterest.com", shortcut: "global" },
      { label: "German Pinterest", url: "https://de.pinterest.com/", category: "de.pinterest.com", shortcut: "de" },
      { label: "French Pinterest", url: "https://fr.pinterest.com/", category: "fr.pinterest.com", shortcut: "fr" },
      { label: "Swiss Pinterest", url: "https://ch.pinterest.com/", category: "ch.pinterest.com", shortcut: "ch" },
      { label: "Polish Pinterest", url: "https://pl.pinterest.com/", category: "pl.pinterest.com", shortcut: "pl" },
      { label: "Russian Pinterest", url: "https://ru.pinterest.com/", category: "ru.pinterest.com", shortcut: "ru" },
      { label: "Belarusian Pinterest", url: "https://pinterest.com/", category: "pinterest.com", shortcut: "by" },
      { label: "Lithuanian Pinterest", url: "https://pinterest.com/", category: "pinterest.com", shortcut: "lt" },
      { label: "Ukrainian Pinterest", url: "https://ua.pinterest.com/", category: "ua.pinterest.com", shortcut: "ua" },
      { label: "Italian Pinterest", url: "https://it.pinterest.com/", category: "it.pinterest.com", shortcut: "it" },
      { label: "Spanish Pinterest", url: "https://es.pinterest.com/", category: "es.pinterest.com", shortcut: "es" },
      { label: "Portuguese Pinterest", url: "https://pt.pinterest.com/", category: "pt.pinterest.com", shortcut: "pt" },
      { label: "British Pinterest", url: "https://uk.pinterest.com/", category: "uk.pinterest.com", shortcut: "uk" },
      { label: "Irish Pinterest", url: "https://ie.pinterest.com/", category: "ie.pinterest.com", shortcut: "ie" },
      { label: "Slovenian Pinterest", url: "https://pinterest.com/", category: "pinterest.com", shortcut: "si" },
      { label: "Slovakian Pinterest", url: "https://pinterest.com/", category: "pinterest.com", shortcut: "sk" },
      { label: "Hungarian Pinterest", url: "https://hu.pinterest.com/", category: "hu.pinterest.com", shortcut: "hu" },
      { label: "Austrian Pinterest", url: "https://at.pinterest.com/", category: "at.pinterest.com", shortcut: "at" },
      { label: "Belgian Pinterest", url: "https://be.pinterest.com/", category: "be.pinterest.com", shortcut: "be" },
      { label: "Dutch Pinterest", url: "https://nl.pinterest.com/", category: "nl.pinterest.com", shortcut: "nl" },
      { label: "Czech Pinterest", url: "https://cz.pinterest.com/", category: "cz.pinterest.com", shortcut: "cz" },
      { label: "Romanian Pinterest", url: "https://ro.pinterest.com/", category: "ro.pinterest.com", shortcut: "ro" },
      { label: "Swedish Pinterest", url: "https://se.pinterest.com/", category: "se.pinterest.com", shortcut: "se" },
      { label: "Norwegian Pinterest", url: "https://no.pinterest.com/", category: "no.pinterest.com", shortcut: "no" },
      { label: "Danish Pinterest", url: "https://dk.pinterest.com/", category: "dk.pinterest.com", shortcut: "dk" },
      { label: "Finnish Pinterest", url: "https://fi.pinterest.com/", category: "fi.pinterest.com", shortcut: "fi" },
      { label: "Greek Pinterest", url: "https://gr.pinterest.com/", category: "gr.pinterest.com", shortcut: "gr" },
      { label: "Turkish Pinterest", url: "https://tr.pinterest.com/", category: "tr.pinterest.com", shortcut: "tr" }
    ];

    const shortcutInput = document.querySelector("#shortcut");
    const searchInput = document.querySelector("#search");
    const container = document.querySelector("#links-container");
    const status = document.querySelector("#status");

    // Handle instant redirect on Enter
    shortcutInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const query = shortcutInput.value.trim().toLowerCase();
        const match = destinations.find(item => item.shortcut === query || item.category === query);

        if (match) {
          status.textContent = "";
          window.location.href = match.url; // Performs the redirect
        } else {
          status.textContent = `No redirect found for "${query}".`;
        }
      }
    });

    // Render list
    function renderLinks(filterText = "") {
      container.innerHTML = "";
      const query = filterText.toLowerCase().trim();
      
      const filtered = destinations.filter(item => 
        item.label.toLowerCase().includes(query) || 
        item.category.toLowerCase().includes(query) ||
        item.shortcut.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-note">No matching sites found.</div>`;
        return;
      }

      for (const dest of filtered) {
        const a = document.createElement("a");
        a.href = dest.url;
        a.className = "link-item";
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        
        a.innerHTML = `
          <span>${dest.label} <small>(:${dest.shortcut})</small></span>
          <span class="badge">${dest.category}</span>
        `;
        container.append(a);
      }
    }

    renderLinks();

    searchInput.addEventListener("input", (e) => {
      renderLinks(e.target.value);
    });
  </script>
  <script src="themes.js"></script>
</body>
</html>
